# One command: docker compose up --build
#   http://localhost:8080  demo partner site (also /savanna.html and /design-system.html)
#   http://localhost:3000  plugin server: /widget.js, /v1 API, /openapi.yaml, /demo/lms (LTI 1.3), /demo/sms-inbox
# Optional: docker compose --profile test run --rm tests   (all unit, API and browser accessibility tests)
services:
  web:
    build: .
    ports:
      - '3000:3000'
    # Settings come from a .env file beside this one, if there is one (copy .env.example). All are optional for a demo.
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      APP_SECRET: ${APP_SECRET:-}
  host:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./demo-host:/usr/share/nginx/html:ro
    depends_on:
      web:
        condition: service_healthy
  tests:
    profiles: ['test']
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /work
    volumes:
      - .:/work
      - /work/node_modules
    environment:
      CI: '1'
    command: sh -c "npm ci && npm test && npx playwright test"
