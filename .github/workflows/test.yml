# Runs every test on every push and pull request. The result is the badge at the top of the README.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Unit, voice and API tests
        run: npm test
      - name: Colour contrast in every theme
        run: npm run contrast
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests (axe-core)
        run: npm run test:a11y
        env: { CI: '1' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: a11y-results, path: test-results/, retention-days: 14 }
